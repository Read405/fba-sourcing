low_inventory_level_fee:
  source: https://sellercentral.amazon.com/help/hub/reference/external/GV43F6S76Y9DHYRH
  retrieved: 2026-10-02
  charged: false
  reason: >-
    Amazon exempts products that sold fewer than 20 units in the past 7 days.
    At 3-5 units per product you stay under that. Revisit if you ever stock 20+
    units of one product.

